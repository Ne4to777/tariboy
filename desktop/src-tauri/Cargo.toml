[package]
name = "tariboy-desktop"
# Numeric package version used by macOS bundle metadata. The canonical
# internal/version.Version string is injected by build.rs as TARIBOY_VERSION
# and is what the app compares against a running daemon. `make desktop` keeps
# both in sync and fails the build if they drift.
version = "0.74.0"
edition = "2021"
rust-version = "1.77"
description = "Tariboy desktop control plane"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
libc = "0.2"
uuid = { version = "=1.8.0", features = ["v4", "serde"] }
portable-pty = "=0.9.0"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
plist = "=1.10.0"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=2.11.1"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "=4.11.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
