name: Desktop Rust cache

# A tag run can restore only caches saved by its own tag or by the default
# branch, so the release job never sees a cache saved by an earlier tag. This
# workflow builds the Desktop Rust dependencies on main with the same profile
# and features as `cargo tauri build`, and saves the cache the release restores.
# The weekly run refreshes it after runner toolchain updates and keeps GitHub
# from evicting it as unused.
on:
  push:
    branches:
      - main
    paths:
      - desktop/src-tauri/Cargo.lock
      - desktop/src-tauri/Cargo.toml
      - .github/workflows/desktop-cache.yml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: desktop-rust-cache
  cancel-in-progress: true

jobs:
  warm:
    name: Warm macOS Rust cache
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: desktop-release

      - name: Install tauri-cli
        run: make desktop-tools-check

      # The same cargo invocation `cargo tauri build` runs for a release. The
      # app crate embeds desktop/dist at compile time, so an empty directory
      # stands in for the UI build; only dependency artifacts are reused.
      - name: Build Desktop Rust dependencies
        run: |
          mkdir -p desktop/dist
          cd desktop/src-tauri
          cargo build --bins --release --locked --features tauri/custom-protocol
